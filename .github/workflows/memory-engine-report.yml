name: Memory Engine report

on:
  pull_request:

permissions:
  contents: read

jobs:
  memory-engine:
    name: Memory Engine checks and advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: ingest embeds git commit dates via git log; shallow clones
          # produce different metadata and false "index drift" (VLNA2 PR-C1).
          fetch-depth: 0
          # PR head SHA — default merge checkout rewrites git log metadata.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck Memory Engine
        run: npm run brain:typecheck

      - name: Test Memory Engine
        run: npm run brain:test

      # D-2026-08-17-01 Variant A: memory/decisions.md is the only SoT.
      # brain/decisions/decisions.md must not exist as a hand-maintained duplicate.
      - name: Forbid hand-maintained brain/decisions/decisions.md
        run: |
          if [ -f brain/decisions/decisions.md ]; then
            echo "brain/decisions/decisions.md must not exist. SoT is memory/decisions.md (D-2026-08-17-01 Variant A)."
            exit 1
          fi

      # VLNA2 PR-C1: do NOT compare committed indexes to a fresh ingest.
      # That gate taught agents to commit regenerated indexes ("refresh indexes")
      # even when sources were unchanged — GUARD_BYPASS. Instead regenerate into
      # a temp brain root and run audit against that view. Ingest still fails the
      # job when validationIssues > 0 (schema/load errors).
      - name: Generate temporary Brain views
        run: npm run brain:ingest -- --brain-root "${{ runner.temp }}/brain"

      - name: Run advisory repository audit
        id: audit
        continue-on-error: true
        run: npm run brain:audit -- --brain-root "${{ runner.temp }}/brain" --output-dir "${{ runner.temp }}/brain-audit"

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-audit-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: ${{ runner.temp }}/brain-audit
          retention-days: 14
          if-no-files-found: warn
