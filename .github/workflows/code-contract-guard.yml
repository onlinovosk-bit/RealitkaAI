name: Code Contract Guard

# Vynucuje pravidlá, ktoré už existujú v .cursor/rules/, ale nikto ich nekontroloval.
# Audit 2026-08-02: revolis-api.mdc dodržiavalo 3-27 % routes; spendCredits() bol
# kompletný, otestovaný a bez jediného call site (únik 9 100 EUR/rok).
#
# OBE kontroly sú ratchet — baseline drží existujúci dlh a job zlyhá LEN pri novom
# porušení. Zámerne: schema-governance-guard.yml musel byť vypnutý, lebo trvalo
# červený beh vytrénoval alarm fatigue. Táto kontrola je na zelenej od prvého dňa.
#
# Žiadne secrets, žiadne npm ci — čisté Node skripty bez závislostí.

on:
  pull_request:
    paths:
      - "apps/crm/src/**"
      - "apps/crm/vercel.json"
      - "apps/crm/scripts/check-api-contract.mjs"
      - "apps/crm/scripts/check-cron-observability.mjs"
      - "apps/crm/scripts/find-dead-exports.mjs"
      - "apps/crm/scripts/*-baseline.json"
      - "apps/crm/scripts/check-schema-gap.mjs"
      - "apps/crm/scripts/schema-gap-allowlist.json"
      # SCHEMA-GAP-RATCHET porovnáva kód s migráciami, takže ho musí spustiť aj PR,
      # ktorý migráciu len zmaže alebo pridá — bez zmeny jediného riadku v src.
      - "apps/crm/supabase/migrations/**"
      - "apps/crm/supabase/functions/**"
  workflow_dispatch:

jobs:
  contract:
    name: Zmluva kódu (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: API route contract (revolis-api.mdc)
        run: node apps/crm/scripts/check-api-contract.mjs --ci

      # CRON-RUNS-CI-GATE-01: každý cron zo vercel.json musí po sebe nechať
      # riadok v `cron_runs`. Tretí výskyt toho istého vzoru (recompute-bri,
      # morning-brief) je lacnejšie zastaviť tu než opravovať spätne.
      - name: Cron denník (ratchet)
        run: node apps/crm/scripts/check-cron-observability.mjs --ci

      # SCHEMA-GAP-RATCHET: kód nesmie volať tabuľku, ktorú nezakladá žiadna migrácia.
      # Tretí smer driftu z AP-023 (PROD<->migrácie sa dá porovnať len proti živej DB,
      # kód<->migrácie z repa). Výnimky sú viazané na príčinu; zoznam sa môže len zmenšovať.
      - name: Schema-gap (kód -> migrácie)
        run: node apps/crm/scripts/check-schema-gap.mjs --ci

      # Script ships with PR #358; until then skip so half-merged #356 does not fail every CRM PR.
      - name: Mŕtve exporty (trieda chyby spendCredits)
        if: hashFiles('apps/crm/scripts/find-dead-exports.mjs') != ''
        run: node apps/crm/scripts/find-dead-exports.mjs --ci
