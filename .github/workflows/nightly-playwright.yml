name: Nightly — Playwright E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-playwright
  cancel-in-progress: true

jobs:
  nightly-e2e:
    name: Nightly Playwright (extended)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Viď saas-grade-pipeline.yml — `contents: read` musí ostať, inak padne
    # checkout; `packages: read` je pre pull z ghcr.io.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/crm/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/crm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. With `latest` the action asks the GitHub API
          # for the newest release on every job, unauthenticated, and on
          # 2026-09-24 that query is what took the pipeline down:
          #
          #   ##[error] Failed to resolve latest Supabase CLI release: rate limit exceeded
          #
          # Lint, the CI helper tests and the typecheck gate had all passed by
          # then; the job died in setup, before `supabase start` was reached.
          # A fixed version needs no such lookup.
          #
          # It also makes the toolchain deterministic: with `latest`, two runs of
          # the same commit could install different CLIs. 2.117.0 is the version
          # `latest` already resolved to (published 2026-09-07), so pinning it
          # changes nothing about what CI installs today.
          #
          # To bump: pick a version published to npm as `supabase`, change it in
          # BOTH workflows, and let CI prove `supabase start` still works — the
          # repo's config.toml still uses the deprecated [inbucket] section, so
          # a CLI jump is not automatically safe.
          version: 2.117.0

      # `supabase start` sťahuje šesť images z ghcr.io. Anonymný pull má nízky
      # limit na zdieľanú IP GitHub runnerov a 2026-09-23 oň CI opakovane
      # zaseklo: najprv zlyhal jeden image, o dve minúty neskôr všetkých šesť
      # (`toomanyrequests`). Tento krok je v poradí 10 z 22, takže keď padne,
      # Test aj Build sa preskočia — CI vtedy o kóde nepovie nič a červená
      # farba nesúvisí s diffom.
      #
      # Prihlásenie zdvihne limit z anonymného na per-account. Token je
      # ephemerálny GITHUB_TOKEN daného behu, nie uložený secret, a ide cez
      # env + --password-stdin, aby sa neobjavil v príkazovom riadku ani v logu.
      - name: Authenticate to ghcr.io (raise pull rate limit)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Ten istý wrapper ako v `saas-grade-pipeline.yml`. Nightly ho doteraz
      # nemal — volal `supabase start` priamo, takže prvé odmietnutie z registry
      # zhodilo celý beh bez jediného pokusu navyše. Registry vyberá skript,
      # preto tu nie je žiadne `env`.
      - name: Start local Supabase
        run: ../../scripts/ci/supabase-start.sh
        working-directory: apps/crm

      - name: Export local credentials
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
        working-directory: apps/crm

      - name: Map service role key for Node
        run: echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
        env:
          SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Reset DB (migracie + seed.sql)
        run: supabase db reset
        working-directory: apps/crm

      - name: Lint
        run: npm run lint
        working-directory: apps/crm

      - name: Build
        run: npm run build
        working-directory: apps/crm
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/crm

      - name: Nightly Playwright (smoke + public + optional auth)
        run: |
          set -e
          npm run start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "Server ready after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::next start did not become ready on :3000"
              exit 1
            fi
            sleep 2
          done
          npm run test:nightly:ci
          if [ -n "${TEST_USER_EMAIL:-}" ] && [ -n "${TEST_USER_PASSWORD:-}" ]; then
            echo "Auth secrets present — running chromium project"
            npx playwright test --project=chromium --reporter=line || echo "::warning::chromium auth suite failed (non-blocking)"
          else
            echo "Skipping chromium project — TEST_USER_EMAIL/PASSWORD not configured"
          fi
        working-directory: apps/crm
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY || env.SERVICE_ROLE_KEY }}
          CRON_SECRET: ci-smoke-cron-secret
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-${{ github.run_id }}
          path: |
            apps/crm/playwright-report/
            apps/crm/test-results/
          retention-days: 14
          if-no-files-found: ignore
