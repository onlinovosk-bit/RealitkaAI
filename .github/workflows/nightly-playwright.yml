name: Nightly — Playwright E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-playwright
  cancel-in-progress: true

jobs:
  nightly-e2e:
    name: Nightly Playwright (extended)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Viď saas-grade-pipeline.yml — `contents: read` musí ostať, inak padne
    # checkout; `packages: read` je pre pull z ghcr.io.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/crm/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/crm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # DORMANTNÝ, ZÁMERNE PONECHANÝ. Po prepnutí registry (krok nižšie) sa
      # z ghcr.io neťahá nič, takže toto prihlásenie práve teraz nič nerobí.
      # Ostáva ako poistka: keby niekto override registry odstránil, pull
      # spadne späť na ghcr.io a pôjde prihlásený, nie anonymne.
      #
      # Prečo samo nestačilo (#667): prihlásenie zdvihne limit z anonymného na
      # per-account, lenže 2026-09-23 vracalo ghcr.io `toomanyrequests ...
      # allowed: 44000/minute` — zdieľaný strop na strane registry, nie naša
      # kvóta. Krok prešiel, pull aj tak padol.
      #
      # Token je ephemerálny GITHUB_TOKEN daného behu, nie uložený secret, a ide
      # cez env + --password-stdin, aby sa neobjavil v príkazovom riadku ani v logu.
      - name: Authenticate to ghcr.io (raise pull rate limit)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Start local Supabase
        env:
          # `supabase/setup-cli` exportuje SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
          # do job env cez $GITHUB_ENV. Step-level `env` má vyššiu prioritu, takže
          # toto nad ním vyhrá — preto to je tu a nie na jobe.
          #
          # Dôvod prepnutia: 2026-09-23 ghcr.io opakovane odmietalo pull s
          # `toomanyrequests ... allowed: 44000/minute`. To NIE je náš anonymný
          # strop — 44000/min je zdieľaný strop na strane registry, takže ani
          # prihlásenie (#667) to neobišlo: krok `Authenticate to ghcr.io` prešiel
          # a pull aj tak padol.
          #
          # `public.ecr.aws` je vlastný default Supabase CLI, čiže najlepšie
          # podporovaná cesta. `docker.io` zámerne NIE: anonymný limit Docker Hubu
          # je 100 pullov / 6 h na IP a `supabase start` ťahá ~10 images — na
          # zdieľaných runneroch by to bolo horšie než to, čo opravujeme.
          #
          # Overené pred zmenou, nie po nej: všetkých šesť images z padnutého logu
          # existuje na public.ecr.aws s presne tými tagmi (HTTP 200 na manifest).
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: supabase start
        working-directory: apps/crm

      - name: Export local credentials
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
        working-directory: apps/crm

      - name: Map service role key for Node
        run: echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
        env:
          SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Reset DB (migracie + seed.sql)
        run: supabase db reset
        working-directory: apps/crm

      - name: Lint
        run: npm run lint
        working-directory: apps/crm

      - name: Build
        run: npm run build
        working-directory: apps/crm
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/crm

      - name: Nightly Playwright (smoke + public + optional auth)
        run: |
          set -e
          npm run start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "Server ready after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::next start did not become ready on :3000"
              exit 1
            fi
            sleep 2
          done
          npm run test:nightly:ci
          if [ -n "${TEST_USER_EMAIL:-}" ] && [ -n "${TEST_USER_PASSWORD:-}" ]; then
            echo "Auth secrets present — running chromium project"
            npx playwright test --project=chromium --reporter=line || echo "::warning::chromium auth suite failed (non-blocking)"
          else
            echo "Skipping chromium project — TEST_USER_EMAIL/PASSWORD not configured"
          fi
        working-directory: apps/crm
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY || env.SERVICE_ROLE_KEY }}
          CRON_SECRET: ci-smoke-cron-secret
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-${{ github.run_id }}
          path: |
            apps/crm/playwright-report/
            apps/crm/test-results/
          retention-days: 14
          if-no-files-found: ignore
