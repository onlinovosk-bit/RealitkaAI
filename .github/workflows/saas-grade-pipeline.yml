name: CI - Revolis.AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # Pridanie `permissions` token OBMEDZÍ presne na vymenované práva, takže
    # `contents: read` tu musí byť — bez neho prestane fungovať checkout.
    # `packages: read` je to, čo potrebuje pull z ghcr.io.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Guard - n8n workflow exports contain no secrets
        run: |
          set -e
          shopt -s nullglob
          files=(automation/n8n/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No n8n JSON exports yet — guard OK (nothing to scan)"
            exit 0
          fi
          if grep -qiE 'apiKey|password|Bearer|client_secret' automation/n8n/*.json; then
            echo "::error::n8n workflow JSON must not contain secrets — use n8n credential store"
            exit 1
          fi
          echo "n8n secrets guard OK (${#files[@]} file(s))"

      - name: Guard - stealth lead-gen legal hold (AP-011)
        run: |
          set -e
          # Unified pattern — blocks funnel/lead/program variants AND recruiter crons in vercel.json
          if grep -qiE 'stealth[-_]?(funnel|lead|recruiter|program)' apps/crm/vercel.json; then
            echo "::error::stealth lead-gen cron must not be registered in vercel.json (GDPR legal hold)."
            exit 1
          fi
          # New stealth surface in app code (stealth-funnel, stealth-lead, stealth-*-programs)
          if grep -riE 'stealth[-_]?(funnel|lead|program)' apps/crm/src \
            --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "::error::stealth lead-gen is legal-hold blocked (GDPR čl. 6(1)(f) nepodpísaný)"
            exit 1
          fi
          # Marketing stealth entry routes
          if [ -d "apps/crm/src/app/(marketing)/start" ]; then
            echo "::error::stealth marketing route /start is legal-hold blocked"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/crm/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/crm

      - name: Lint
        run: npm run lint
        working-directory: apps/crm

      # The retry that guards `supabase start` is itself guarded: a wrapper that
      # silently stopped retrying, or looped forever, would be worse than none.
      - name: Test CI helper scripts
        run: ./scripts/ci/__tests__/supabase-start.test.sh

      - name: Typecheck (baseline gate)
        working-directory: apps/crm
        run: node scripts/typecheck-baseline.mjs

      # ── Ephemeral test DB: žiadne prod secrets v test/build fáze ──
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. With `latest` the action asks the GitHub API
          # for the newest release on every job, unauthenticated, and on
          # 2026-09-24 that query is what took the pipeline down:
          #
          #   ##[error] Failed to resolve latest Supabase CLI release: rate limit exceeded
          #
          # Lint, the CI helper tests and the typecheck gate had all passed by
          # then; the job died in setup, before `supabase start` was reached.
          # A fixed version needs no such lookup.
          #
          # It also makes the toolchain deterministic: with `latest`, two runs of
          # the same commit could install different CLIs. 2.117.0 is the version
          # `latest` already resolved to (published 2026-09-07), so pinning it
          # changes nothing about what CI installs today.
          #
          # To bump: pick a version published to npm as `supabase`, change it in
          # BOTH workflows, and let CI prove `supabase start` still works — the
          # repo's config.toml still uses the deprecated [inbucket] section, so
          # a CLI jump is not automatically safe.
          version: 2.117.0

      # `supabase start` sťahuje šesť images z ghcr.io. Anonymný pull má nízky
      # limit na zdieľanú IP GitHub runnerov a 2026-09-23 oň CI opakovane
      # zaseklo: najprv zlyhal jeden image, o dve minúty neskôr všetkých šesť
      # (`toomanyrequests`). Tento krok je v poradí 10 z 22, takže keď padne,
      # Test aj Build sa preskočia — CI vtedy o kóde nepovie nič a červená
      # farba nesúvisí s diffom.
      #
      # Prihlásenie zdvihne limit z anonymného na per-account. Token je
      # ephemerálny GITHUB_TOKEN daného behu, nie uložený secret, a ide cez
      # env + --password-stdin, aby sa neobjavil v príkazovom riadku ani v logu.
      - name: Authenticate to ghcr.io (raise pull rate limit)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Prihlásenie vyššie je nutné, ale nestačí, a čakanie tiež nie: prvá verzia
      # wrappera skúšala ghcr.io trikrát s 45s a 90s backoffom, bežala 3m44s a
      # aj tak spadla. Preto `scripts/ci/supabase-start.sh` mení registry, nie
      # čas — nesie celú diagnózu a kryje ho `scripts/ci/__tests__`.
      #
      # Registry vyberá skript, nie tento krok: nastavuje
      # SUPABASE_INTERNAL_IMAGE_REGISTRY pre každý pokus zvlášť, takže akékoľvek
      # step-level `env` by aj tak prebil. Hodnota tu by teda nič nerobila a
      # budúci čitateľ by podľa nej hádal zle — preto tu žiadna nie je.
      #
      # Poznámka k `Authenticate to ghcr.io` vyššie: odkedy default zoznam vedie
      # `public.ecr.aws` a ghcr.io v ňom nie je, ten krok je dormantný. Ostáva
      # ako poistka pre prípad, že `SUPABASE_START_REGISTRIES` ghcr.io vráti —
      # vtedy pôjde pull prihlásený, nie anonymne.
      - name: Start local Supabase
        run: ../../scripts/ci/supabase-start.sh
        working-directory: apps/crm

      - name: Export local credentials
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
        working-directory: apps/crm

      - name: Map service role key for Node tests
        run: echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
        env:
          SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Map ephemeral DB credentials to TEST_SUPABASE_*
        run: |
          echo "TEST_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
        env:
          API_URL: ${{ env.API_URL }}
          ANON_KEY: ${{ env.ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Guard - TEST_SUPABASE_* must point to ephemeral local DB
        run: |
          case "$TEST_SUPABASE_URL" in
            *127.0.0.1*|*localhost*)
              echo "TEST guard OK: $TEST_SUPABASE_URL" ;;
            *)
              echo "::error::TEST_SUPABASE_URL is not local ephemeral DB ($TEST_SUPABASE_URL)"
              exit 1 ;;
          esac
        env:
          TEST_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}

      # Allowlist guard: fail, ak DB NIE JE lokálne test prostredie.
      # (Nahrádza pôvodný blacklist "Block E2E on production".)
      - name: Guard - testy len proti allowlistu test DB
        run: |
          case "$API_URL" in
            *127.0.0.1*|*localhost*)
              echo "Guard OK: $API_URL" ;;
            *)
              echo "::error::DB URL nie je v allowliste test prostredí - testy zablokované."
              exit 1 ;;
          esac

      - name: Reset DB (migracie + seed.sql)
        run: supabase db reset
        working-directory: apps/crm

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          grep -E "RLS tenant isolation|tests/rls/" test-output.log
          grep -q "RLS tenant isolation suite" test-output.log || (echo "::error::RLS suite did not execute — check vitest include for tests/rls/" && exit 1)
          grep -q "tests/rls/rls-tenant-isolation.test.ts" test-output.log || (echo "::error::RLS test file not in vitest output" && exit 1)
          grep -q "tests/rls/enrichment-log-rls.test.ts" test-output.log || (echo "::error::enrichment-log RLS test file not in vitest output" && exit 1)
          grep -q "enrichment_log RLS isolation" test-output.log || (echo "::error::enrichment_log RLS isolation suite did not execute" && exit 1)
        working-directory: apps/crm
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY || env.SERVICE_ROLE_KEY }}
          TEST_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build
        run: npm run build
        working-directory: apps/crm
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Debug - find .next
        run: |
          echo "=== Workspace root ==="
          ls -la ${{ github.workspace }}
          echo "=== apps/crm contents ==="
          ls -la ${{ github.workspace }}/apps/crm/
          echo "=== .next exists? ==="
          ls -la ${{ github.workspace }}/apps/crm/.next/ || echo "NOT FOUND"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: ${{ github.workspace }}/apps/crm/.next/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

      # ── Playwright smoke (Fáza 1): reálna smoke brána pred merge ──
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/crm

      - name: Playwright smoke (next start + ephemeral DB)
        run: |
          set -e
          npm run start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "Server ready after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::next start did not become ready on :3000"
              exit 1
            fi
            sleep 2
          done
          npm run test:smoke:ci
        working-directory: apps/crm
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY || env.SERVICE_ROLE_KEY }}
          TEST_SUPABASE_URL: ${{ env.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ env.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ci-smoke-cron-secret
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.sha }}
          path: |
            apps/crm/playwright-report/
            apps/crm/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── CP-P0-4 Control Contract ──────────────────────────────────────────────
  # Runs standalone: the package has zero runtime dependencies, so this job needs
  # no npm install and no ephemeral DB. It gates the authority engine on its own,
  # independently of whether the CRM job can start Supabase.
  control-contract:
    name: Control Contract (authority + closed loop)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard - the contract has no runtime dependencies
        run: |
          set -e
          if grep -RnP '^\s*import .* from "(?!\./|\.\./|node:)' packages/control-contract/src; then
            echo "::error::packages/control-contract must import only relative paths and node: builtins"
            exit 1
          fi
          if node -e "const p=require('./packages/control-contract/package.json');process.exit(p.dependencies?1:0)"; then
            echo "dependency guard OK"
          else
            echo "::error::packages/control-contract must declare no runtime dependencies"
            exit 1
          fi

      - name: Install typecheck tooling (dev only, nothing at runtime)
        run: npm install --no-save --no-package-lock --no-audit --no-fund typescript@5.9.3 @types/node@22
        working-directory: packages/control-contract

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: packages/control-contract

      - name: Test
        run: node --test packages/control-contract/tests/*.test.ts

  bus:
    name: BUS (transport authority boundary)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step for the suite: the bus imports nothing but node builtins,
      # so it runs on a bare checkout. If that ever stops being true this job
      # fails on the import, which is the honest signal.
      - name: Test
        run: npm run bus:test

      # Envelopes are data, and the tests do not read them: a malformed `v: 1`
      # message reaches main through a green Test step. `bus:validate` exits 1 on
      # an error, so this is a gate rather than a report. Pre-v1 messages stay
      # warnings by the standing decision not to rewrite them, and warnings do
      # not fail — only errors do. Runs before the tooling install for the same
      # bare-checkout reason as the suite above.
      - name: Validate envelopes
        run: npm run bus:validate

      # The suite runs under Node's type-stripping, which discards types rather
      # than checking them — #612 shipped three type errors straight through a
      # green Test step. #617 added the tsconfig and the `bus:typecheck` script
      # but nothing invoked them, so the guard was declarative. This runs it.
      #
      # Tooling is installed here, dev-only, mirroring the control-contract job:
      # the bus has no runtime dependencies and a root `npm install` would tie
      # this job to the whole monorepo's dependency tree for no gain.
      - name: Install typecheck tooling (dev only, nothing at runtime)
        run: npm install --no-save --no-package-lock --no-audit --no-fund typescript@5.9.3 @types/node@22
        working-directory: packages/bus-core

      # Same tsconfig and same tsc version as the root `npm run bus:typecheck`,
      # invoked from the package because that is where the tooling lives.
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: packages/bus-core
